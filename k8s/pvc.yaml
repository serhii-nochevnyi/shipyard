apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-shipyard-state
  labels:
    app.kubernetes.io/name: claude-shipyard
spec:
  # A single claim, split by subPath in the StatefulSet: `workspace` (checkouts
  # and ticket worktrees), `cache` (~/.cache) and `claude-state` (remote-MCP OAuth
  # credentials). ReadWriteOnce because exactly one pod uses it.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: intentionally unset — the cluster default is used. Set it
  # explicitly if your cluster has no default class.
