apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude-shipyard
  labels:
    app.kubernetes.io/name: claude-shipyard
spec:
  serviceName: claude-shipyard
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-shipyard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-shipyard
    spec:
      # The image runs as uid 1000 (`dev`); make the volume group-owned by it so
      # the entrypoint can write /workspace and ~/.claude-state.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: dev
          # Replace with the image you pushed to a registry the cluster can pull.
          image: ghcr.io/OWNER/claude-shipyard:latest
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT (merge MCP defaults, restore credentials, seed
          # trust) must still run, so keep it and only replace the command it
          # execs: an idle process, since this pod is used via `kubectl exec`.
          args: ["bash", "-lc", "sleep infinity"]
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: claude-shipyard-config
            - secretRef:
                name: claude-shipyard-secrets
          volumeMounts:
            - name: state
              mountPath: /workspace
              subPath: workspace
            - name: state
              mountPath: /home/dev/.cache
              subPath: cache
            # Durable remote-MCP OAuth state. A directory, mirrored by the
            # entrypoint — never a single-file mount (rename(2) cannot replace one).
            - name: state
              mountPath: /home/dev/.claude-state
              subPath: claude-state
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            exec:
              command: ["bash", "-lc", "test -w /workspace && command -v claude >/dev/null"]
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: claude-shipyard-state
