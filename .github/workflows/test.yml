# The fast suite, on every PR and every push to main.
#
# Scope is deliberate: `make test-fast` only. It needs no network and no npm
# install (this repo has no package.json — the tests run on bare node),
# so it finishes in seconds and covers the deterministic layer where this repo's
# sharp bugs live: the frontmatter parser, the model policy, the graph validator,
# the worktree lifecycle, the pre-publish gates, the sentinel, and the docs
# contract.
#
# NOT here, on purpose: test-codex-shipyard installs gsd-core from the network.
# It stays in the full local suite so this job remains a quick deterministic
# signal on every push.
#
# Why this exists: until it did, every PR in this repository reported "no checks
# reported", and `state-sync` had to warn on each one that "green" meant
# "nothing ran". See .planning/backlog/no-ci-in-the-conveyors-own-repo.md.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes the run in flight — the older result
  # describes a tree nobody will merge.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Keep CI on the supported Node major used by the host-side scripts.
          node-version: '24.15.0'

      - name: product change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          node plugins/delivery-pipeline/scripts/development-artifacts.cjs "$BASE" HEAD >> "$GITHUB_OUTPUT"

      - name: development artifacts only
        if: steps.scope.outputs.product_changes != 'true'
        run: echo "Development artifacts are excluded from product review and verification."

      - name: publish gate
        if: steps.scope.outputs.product_changes == 'true'
        run: |
          BASE=origin/main
          if [ -n "$GITHUB_BASE_REF" ]; then BASE=origin/$GITHUB_BASE_REF; fi
          node plugins/delivery-pipeline/scripts/publish-gate.cjs --base "$BASE" --working-tree --json

      - name: runtime digest trailer
        if: steps.scope.outputs.product_changes == 'true' && github.event_name == 'pull_request'
        run: node scripts/check-runtime-digest-trailer.cjs --base "origin/${{ github.base_ref || 'main' }}"

      - name: OS sandbox backend
        if: steps.scope.outputs.product_changes == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --die-with-parent --ro-bind / / /bin/true

      - name: make test-fast
        if: steps.scope.outputs.product_changes == 'true'
        env:
          SHIPYARD_REQUIRE_OS_SANDBOX: "1"
          COMMENT_POLICY_BASE: origin/${{ github.base_ref || 'main' }}
        run: make test-fast
