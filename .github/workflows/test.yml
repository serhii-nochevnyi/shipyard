# The fast suite, on every PR and every push to main.
#
# Scope is deliberate: `make test-fast` only. It needs no network and no npm
# install (this repo has no package.json — the tests run on bare node),
# so it finishes in seconds and covers the deterministic layer where this repo's
# sharp bugs live: the frontmatter parser, the model policy, the graph validator,
# the worktree lifecycle, the pre-publish gates, the sentinel, and the docs
# contract.
#
# NOT here, on purpose: test-codex-shipyard installs gsd-core from the network.
# It stays in the full local suite so this job remains a quick deterministic
# signal on every push.
#
# Why this exists: until it did, every PR in this repository reported "no checks
# reported", and `state-sync` had to warn on each one that "green" meant
# "nothing ran". See .planning/backlog/no-ci-in-the-conveyors-own-repo.md.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes the run in flight — the older result
  # describes a tree nobody will merge.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Keep CI on the supported Node major used by the host-side scripts.
          node-version: '24.15.0'

      - name: publish gate
        run: |
          BASE=origin/main
          if [ -n "$GITHUB_BASE_REF" ]; then BASE=origin/$GITHUB_BASE_REF; fi
          node plugins/delivery-pipeline/scripts/publish-gate.cjs --base "$BASE" --working-tree --json

      - name: make test-fast
        run: make test-fast
